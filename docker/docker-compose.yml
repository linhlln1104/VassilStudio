name: vassil-studio

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vassil-studio:local
    ports:
      - "${VASSIL_PORT:-${VVOICE_PORT:-8000}}:8000"
    environment:
      VASSIL_ROOT: /app
      VASSIL_CONFIG: /app/config/vassil.example.json
      VASSIL_STUDIO_DIR: /app/frontend/studio-react/dist
      VASSIL_API_KEYS: ${VASSIL_API_KEYS:-${VVOICE_API_KEYS:-}}
      VASSIL_AUTH_REQUIRED: ${VASSIL_AUTH_REQUIRED:-false}
      VASSIL_SESSION_SECRET: ${VASSIL_SESSION_SECRET:-}
      VASSIL_SECURE_COOKIES: ${VASSIL_SECURE_COOKIES:-false}
      VVOICE_ROOT: /app
      VVOICE_CONFIG: /app/config/vvoice.example.json
      VVOICE_STUDIO_DIR: /app/frontend/studio-react/dist
      VVOICE_API_KEYS: ${VVOICE_API_KEYS:-}
    volumes:
      - ../models:/app/models:ro
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
