[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vassil-studio"
version = "0.1.0"
description = "VassilStudio local voice platform using ZipFormer ASR and ZipVoice TTS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "librosa>=0.10",
  "imageio-ffmpeg>=0.5",
  "phonemizer-fork==3.3.2",
  "espeakng-loader==0.2.4",
]

[project.optional-dependencies]
runtime = [
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "websockets>=13",
  "onnxruntime==1.27.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "sherpa-onnx==1.13.3",
]
test = [
  "httpx2==2.5.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
]
qa = [
  "uvicorn>=0.30",
]
dev = [
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "websockets>=13",
  "onnxruntime==1.27.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "sherpa-onnx==1.13.3",
  "httpx2==2.5.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[project.urls]
Homepage = "https://github.com/linhlln1104/VassilStudio"
Repository = "https://github.com/linhlln1104/VassilStudio"
Issues = "https://github.com/linhlln1104/VassilStudio/issues"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["foundation", ".venv", "Zipmodel"]
