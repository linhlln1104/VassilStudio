[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vassil-studio"
version = "0.1.0"
description = "VassilStudio local voice platform using ZipFormer ASR and ZipVoice TTS"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "librosa>=0.10",
  "imageio-ffmpeg>=0.5",
  "phonemizer-fork==3.3.2",
  "espeakng-loader==0.2.4",
]

[project.optional-dependencies]
runtime = [
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "websockets>=13",
  "onnxruntime>=1.23",
  "torch>=2.3",
  "torchaudio>=2.3",
  "sherpa-onnx==1.13.3",
]
test = [
  "httpx2==2.5.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
]
dev = [
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "websockets>=13",
  "onnxruntime>=1.23",
  "torch>=2.3",
  "torchaudio>=2.3",
  "sherpa-onnx==1.13.3",
  "httpx2==2.5.0",
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["foundation", ".venv", "Zipmodel"]
